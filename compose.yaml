name: personal-site

services:
  # One-shot build: compiles the Haskell generator and renders dist/.
  #   docker compose build site-build
  #   docker compose run --rm site-build              # build the site
  #   docker compose run --rm site-build stack test   # tests
  #   docker compose run --rm site-build stack exec -- site check
  site-build:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-site-build:local
    working_dir: /work
    volumes:
      - type: bind
        source: .
        target: /work
      - type: volume
        source: stack-root
        target: /stack-root

  # Static preview of dist/ at http://localhost:8080/ (no Haskell, no backend).
  # Missing paths get dist/404.html with HTTP 404, as on a static host.
  #   docker compose up preview
  preview:
    image: nginx:1.27.3-alpine
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./docker/preview.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          # Fail loudly if the site has not been built yet, rather than
          # creating an empty root-owned dist/ on the host.
          create_host_path: false

  # Development-only hero preview at http://localhost:8081/: serves a site
  # built from the throwaway tree tools/art/hero_preview.py writes into
  # .local/hero-preview/ (never from content/). See README "Previewing a hero".
  #   docker compose --profile tools up -d hero-preview
  hero-preview:
    profiles: ["tools"]
    image: nginx:1.27.3-alpine
    ports:
      - "8081:80"
    volumes:
      - type: bind
        source: ./docker/preview.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      # The parent directory, so the build's swap of html/ is seen at once.
      - type: bind
        source: ./.local/hero-preview
        target: /usr/share/nginx
        read_only: true
        bind:
          create_host_path: false

  # Development-only fixture preview at http://localhost:8082/: serves a site
  # built from the throwaway tree tools/art/fixture_site.py writes into
  # .local/fixture-site/ (a fixture article and résumé PDF, so Writing and
  # the Résumé link can be reviewed; never from content/).
  #   docker compose --profile tools up -d fixture-preview
  fixture-preview:
    profiles: ["tools"]
    image: nginx:1.27.3-alpine
    ports:
      - "8082:80"
    volumes:
      - type: bind
        source: ./docker/preview.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./.local/fixture-site
        target: /usr/share/nginx
        read_only: true
        bind:
          create_host_path: false

  # Development-only screenshot capture (not part of the site build).
  #   docker compose --profile tools run --rm screenshots
  screenshots:
    profiles: ["tools"]
    build:
      context: ./tools
    image: personal-site-tools:local
    depends_on:
      - preview
    working_dir: /work
    environment:
      PREVIEW_URL: http://preview/
    volumes:
      - type: bind
        source: ./tools/screenshots
        target: /work/tools/screenshots
        read_only: true
      - type: bind
        source: ./design/proof
        target: /work/design/proof
    command: ["python3", "tools/screenshots/capture.py"]

  # Development-only art tooling: reconstructs the hero plates from the
  # owner's approved render, prepares the About emblem, and renders comparison
  # sheets. Outputs are committed source assets; the site build never runs it.
  #   docker compose --profile tools run --rm art python3 tools/art/reconstruct.py
  #   docker compose --profile tools run --rm art python3 tools/art/monogram_sheet.py
  art:
    profiles: ["tools"]
    build:
      context: ./tools
    image: personal-site-tools:local
    working_dir: /work
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: .
        target: /work
    command: ["python3", "tools/art/compare.py"]

  # ---- Release tooling (Phase 07). Driven by scripts/release.sh; see
  # docs/operations/deployment.md. None of these run in a normal build.

  # Packaging and smoke tests (Python, stdlib + Playwright from the tools image).
  release:
    profiles: ["release"]
    build:
      context: ./tools
    image: personal-site-tools:local
    working_dir: /work
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: .
        target: /work

  # Pinned Wrangler WITHOUT credentials: configuration checks and
  # `wrangler deploy --dry-run` only. It sees only the configuration and the
  # packaged files (never the repository, so never a stray .env), and no
  # Cloudflare token is passed in, so it cannot publish anything.
  wrangler:
    profiles: ["release"]
    build:
      context: ./release
    image: personal-site-wrangler:local
    working_dir: /work
    volumes: &wrangler-mounts
      - type: bind
        source: ./wrangler.toml
        target: /work/wrangler.toml
        read_only: true
      - type: bind
        source: ./.release/public
        target: /work/.release/public
        read_only: true
        bind:
          create_host_path: false

  # Local Cloudflare emulation (workerd via `wrangler dev`) of the packaged
  # release at http://localhost:8787/, for routing, 404 and header checks.
  # No credentials; nothing leaves the machine.
  wrangler-dev:
    profiles: ["release"]
    image: personal-site-wrangler:local
    working_dir: /work
    ports:
      - "127.0.0.1:8787:8787"
    volumes: *wrangler-mounts
    command: ["wrangler", "dev", "--local", "--ip", "0.0.0.0", "--port", "8787", "--show-interactive-dev-session=false"]

  # The ONLY service that receives Cloudflare credentials, by name from the
  # operator's environment (never stored here). Used by `release.sh deploy
  # --confirm`, `versions` and `rollback` only.
  wrangler-deploy:
    profiles: ["release"]
    image: personal-site-wrangler:local
    working_dir: /work
    environment:
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ACCOUNT_ID
    volumes: *wrangler-mounts

volumes:
  # Persistent Stack root (GHC package DBs, snapshot and Brigid builds).
  # Created automatically by Compose; remove with `docker compose down -v`.
  stack-root:
