    <path d="M89 18H84V12H78V7" stroke-width="0.7" stroke-opacity="0.5"/>
    <path d="M7 78H12V84H18V89" stroke-width="0.7" stroke-opacity="0.5"/>
    <path d="M89 78H84V84H78V89" stroke-width="0.7" stroke-opacity="0.5"/>
  </g>
  <g fill="#C2A46A" fill-opacity="0.85">
