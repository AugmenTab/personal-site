<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Tileable warm grain for "aged print" texture. Used at low opacity. -->
  <filter id="n" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="3"/>
    <feColorMatrix type="matrix"
      values="0 0 0 0 0.78
              0 0 0 0 0.66
              0 0 0 0 0.45
              0 0 0 -1.6 1.05"/>
  </filter>
  <rect width="240" height="240" filter="url(#n)" opacity="0.14"/>
</svg>
