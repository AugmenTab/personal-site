<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <!-- Project card art for Paranoia Engine (Lockdown demo): a stepped facility block in isometric
       projection above a ruled timeline of ticks whose path branches (a nod
       to replay and counterfactual runs). Decorative only. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD3A0"/>
      <stop offset="1" stop-color="#9C7F48"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#16201C"/>
      <stop offset="0.6" stop-color="#110F10"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </radialGradient>
  </defs>
  <rect width="360" height="360" fill="url(#bg)"/>

  <g fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round">
    <!-- lower tier -->
    <path stroke-width="1.4" d="M180 210L92 166L180 122L268 166Z"/>
    <path stroke-width="1.4" d="M92 166V190L180 234L268 190V166M180 210V234"/>
    <!-- middle tier -->
    <path stroke-width="1.3" d="M180 176L120 146L180 116L240 146Z"/>
    <path stroke-width="1.3" d="M120 146V160M240 146V160M180 176V190"/>
    <path stroke-width="1" opacity="0.8" d="M120 160L180 190L240 160"/>
    <!-- upper tier -->
    <path stroke-width="1.2" d="M180 140L148 124L180 108L212 124Z"/>
    <path stroke-width="1.2" d="M148 124V98L180 82L212 98V124M180 140V114L148 98M180 114L212 98"/>
    <!-- doorways and wall lines -->
    <path stroke-width="0.8" opacity="0.6" d="M132 199V185L144 191V205M216 205V191L228 185V199"/>
    <path stroke-width="0.6" opacity="0.4" d="M104 184L180 222L256 184M164 104V128M196 104V128"/>
    <!-- aerial -->
    <path stroke-width="0.9" opacity="0.8" d="M180 82V56M172 64H188"/>
    <circle cx="180" cy="52" r="3" stroke-width="0.9"/>

    <!-- timeline of ticks -->
    <path stroke-width="1.1" d="M56 270H304"/>
    <path stroke-width="0.8" opacity="0.6" d="M64 264V276M88 264V276M112 264V276M136 264V276M160 264V276M184 264V276M208 264V276M232 264V276M256 264V276M280 264V276M304 264V276"/>
    <!-- branch: the run diverges at a tick -->
    <path stroke-width="1" opacity="0.75" d="M184 270C206 270 214 298 240 298H304"/>
    <path stroke-width="0.6" opacity="0.5" d="M232 292V304M256 292V304M280 292V304"/>
    <path d="M184 266l4 4l-4 4l-4 -4z" fill="#C2A46A" stroke="none"/>

    <!-- frame -->
    <rect x="16" y="16" width="328" height="328" stroke-width="1" opacity="0.55"/>
    <rect x="22" y="22" width="316" height="316" stroke-width="0.6" opacity="0.35"/>
  </g>
</svg>
