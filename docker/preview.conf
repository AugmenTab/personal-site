# Preview server for dist/ (development only; production hosting is Phase 07).
# Mirrors what a static host does with the generated 404.html: any missing
# path is answered with that document and HTTP 404.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Phase 06: compress text as a production static host does, so local
    # performance measurements are representative (HTML is always included).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
